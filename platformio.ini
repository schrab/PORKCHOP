; Author: 0ct0

[env:m5cardputer]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
custom_version = 0.1.2
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.sdkconfig = sdkconfig.defaults
monitor_speed = 115200
upload_speed = 460800

; Build flags
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    -DPORKCHOP_LOG_ENABLED=0
    -include src/core/logging.h
    -DARDUINO_M5Stack_StampS3
    ; NimBLE: Disable PSRAM usage (not available on this board)
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=0
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
    ; NimBLE: Reduce log verbosity (0=NONE, 1=ERROR, 2=WARNING, 3=INFO, 4=DEBUG)
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=1
    ; Allow muldefs for raw_frame_sanity_check override
    -Wl,-zmuldefs
    -Os

lib_deps = 
    m5stack/M5Unified@^0.2.11
    m5stack/M5Cardputer@^1.1.1
    bblanchon/ArduinoJson@^7.4.2
    mikalhart/TinyGPSPlus@^1.0.3
    h2zero/NimBLE-Arduino@^2.3.7

extra_scripts = pre:scripts/pre_build.py

; ============================================================
[env:esp32s3-mini]
platform = espressif32@6.12.0
board = esp32s3_mini_n16r8_quad
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions_esp32s3_mini.csv

; PSRAM: 8MB quad at 40MHz
board_build.psram = enable
board_build.psram_mode = quad
board_build.psram_freq = 40MHz
board_build.sdkconfig = sdkconfig.esp32s3_mini

monitor_speed = 115200
upload_speed = 921600
upload_port = COM35

build_flags =
    -DBOARD_ESP32S3_MINI=1
    -DCORE_DEBUG_LEVEL=0
    -DPORKCHOP_LOG_ENABLED=1
    -include src/core/logging.h
    ; Force Quad PSRAM mode (board JSON memory_type may default to Octal)
    -DCONFIG_SPIRAM_MODE_QUAD=1
    -UCONFIG_SPIRAM_MODE_OCT
    ; TFT_eSPI: use custom pin setup (USER_SETUP_LOADED defined inside User_Setup.h)
    -include src/User_Setup.h
    ; NimBLE: use PSRAM for BLE heap
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=0
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=1
    -Wl,-zmuldefs
    -Os
    ; Lock-hold profiling in NetworkRecon::enterCritical/exitCritical.
    ; Adds lockMax/lockTotal/lockCalls fields to the OINK diag emit
    ; (lines like `[OINK-DIAG] ... lockMax=N lockTotal=N lockCalls=N`).
    ; Off by default in other envs. Cost: a few register reads per
    ; enter/exit pair, no logging in the hot path.
    -DNETRECON_LOCK_PROFILE=1

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.4.2
    mikalhart/TinyGPSPlus@^1.0.3
    h2zero/NimBLE-Arduino@^2.3.7
    adafruit/Adafruit NeoPixel@^1.12.5

extra_scripts = pre:scripts/pre_build.py

; ============================================================
[env:m5cardputer-debug]
extends = env:m5cardputer
build_type = debug
build_flags = 
    ${env:m5cardputer.build_flags}
    -DPORKCHOP_LOG_ENABLED=1
    -DDEBUG_MODE=1
    -DCORE_DEBUG_LEVEL=4

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_INCLUDE_FLOAT
test_build_src = false

[env:native_coverage]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_INCLUDE_FLOAT
    -O0
    -g
    -fprofile-arcs
    -ftest-coverage
    -lgcov
    --coverage
build_unflags =
    -O2
    -O3
test_build_src = false

